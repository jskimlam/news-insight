<!DOCTYPE html>
<!-- ===================================================================
  케미칼 뉴스 인사이트 - 화면 (index.html)
  - GitHub Pages에 올리는 단일 파일입니다.
  - 아래 스크립트의 API_URL 에 Apps Script 웹앱 주소를 넣으면 구글시트 데이터가 표시됩니다.
  - API_URL 이 비어 있는 동안에는 '샘플 모드'로 내장 샘플 기사 4건이 표시됩니다.
==================================================================== -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>케미칼 뉴스 인사이트</title>
<!-- LAM newspaper app identity -->
<link rel="icon" type="image/png" sizes="32x32" href="./assets/lam-news-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/lam-news-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="./assets/lam-news-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F3F0E8">
<meta property="og:title" content="LAM INSIGHT NEW · 케미칼 뉴스 인사이트">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jskimlam.github.io/news-insight/">
<meta property="og:image" content="https://jskimlam.github.io/news-insight/assets/lam-news-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:image:alt" content="LAM INSIGHT NEW 신문형 앱 아이콘">

<!-- 글꼴: 본문·제목은 명조(Noto Serif KR), 작은 안내 글자는 고딕(Noto Sans KR) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* ---------- 기본 색과 글꼴 ---------- */
html{font-size:clamp(15px,14.2px + 0.26vw,17px);-webkit-text-size-adjust:100%}
:root{--paper:#F3F0E8;--field:#FBF9F4;--ink:#1A1A1A;--mute:#5A5750;--rule:#CFC9BC;--line:#8A857A;--up:#B4410B;--down:#1D5FA8;--flat:#4A4740;--sans:'Noto Sans KR',system-ui,sans-serif;--serif:'Noto Serif KR','Nanum Myeongjo',serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:0.9375rem;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 맨 위 띠: 샘플 안내, 검색, 등록 버튼 ---------- */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:8px 0;border-bottom:1px solid var(--ink);font-family:var(--sans);font-size:0.7812rem}
.strip .note{color:var(--mute)}
.strip .right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.search{position:relative;display:block;width:260px;max-width:100%}
.search svg{position:absolute;left:10px;top:14px}
.search input{width:100%;height:44px;padding:0 10px 0 34px;border:1px solid var(--ink);border-radius:0;background:var(--field);color:var(--ink);font:inherit;font-size:0.8438rem}
.btn-solid{height:44px;padding:0 18px;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);font-family:var(--sans);font-weight:700;font-size:0.8438rem;text-decoration:none;border:none}
.btn-line{min-height:44px;padding:0 18px;display:inline-flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:700;font-size:0.8438rem;text-decoration:none;border:1px solid var(--ink)}

/* ---------- 제호 ---------- */
.masthead{text-align:center;padding:22px 0 16px;border-bottom:3px double var(--ink)}
.masthead .eyebrow{font-family:var(--sans);font-size:0.6875rem;font-weight:500;letter-spacing:.32em;color:var(--mute)}
.masthead h1{margin:8px 0 6px;font-size:clamp(34px,6vw,66px);font-weight:900;letter-spacing:-.015em;line-height:1.15}
.masthead h1 a{text-decoration:none}
.masthead .sub{font-family:var(--sans);font-size:0.8125rem;color:var(--mute)}

/* ---------- 날짜 이동 줄 ---------- */
.datebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--rule);font-family:var(--sans)}
.datebar button,.datebar .pill{min-height:44px;padding:0 14px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font:inherit;font-size:0.8438rem;font-weight:700}
.datecenter{text-align:center;min-width:250px}
.datetitle{font-family:var(--serif);font-size:1.375rem;font-weight:900;letter-spacing:-.01em}
.datenote{font-size:0.7812rem;color:var(--mute)}
.datetools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:12px}
.datetools label{display:flex;align-items:center;gap:8px;font-size:0.7812rem;color:var(--mute)}
.datetools input{height:44px;padding:0 10px;border:1px solid var(--ink);border-radius:0;background:var(--field);color:var(--ink);font:inherit;font-size:0.8438rem}

/* ---------- 품목·가격영향 메뉴 ---------- */
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;border-bottom:1px solid var(--ink)}
.navbtn{min-height:44px;margin-bottom:-1px;padding:0 16px;background:none;border:none;border-bottom:3px solid transparent;font-family:var(--sans);font-size:0.9062rem;font-weight:500;color:var(--mute)}
.navbtn.on{border-bottom-color:var(--ink);font-weight:700;color:var(--ink)}
.navbtn small{font-size:0.75rem;font-weight:400;color:var(--mute)}
.navright{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px}
.navright .navbtn{padding:0 10px;font-size:0.8125rem}
.navlabel{font-family:var(--sans);font-size:0.75rem;color:var(--mute);margin-right:6px}

/* ---------- 1면 ---------- */
main{padding:30px 0 56px}
.front{display:flex;flex-wrap:wrap;align-items:flex-start;gap:32px 0}
.lead{flex:2 1 560px;min-width:0;padding-right:36px}
.lead.ruled{border-right:1px solid var(--rule)}
.side{flex:1 1 320px;min-width:0;padding-left:36px}
.kicker{font-family:var(--sans);font-size:0.75rem;font-weight:700;letter-spacing:.1em}
.hl{margin:10px 0 0;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.hl a{text-decoration:none}
.hl a:hover{text-decoration:underline}
.lead .hl{margin-top:12px;font-size:clamp(28px,3.4vw,44px);font-weight:900;line-height:1.32;letter-spacing:-.015em}
.side .hl{font-size:1.4375rem}
.rest .hl{font-size:1.25rem;line-height:1.45}
.en{margin:10px 0 0;font-style:italic;font-size:0.9375rem;color:var(--mute)}
.deck{margin:10px 0 0;font-size:0.9375rem;line-height:1.75;color:#2C2A26;text-wrap:pretty}
.lead .deck{margin-top:18px;font-size:1.125rem;line-height:1.8}
.rest .deck{font-size:0.9062rem}
.points{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--ink)}
.points li{display:flex;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule)}
.points b{flex:none;width:20px;font-weight:900;font-size:1.125rem}
.points span{font-size:0.9688rem;line-height:1.75}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:12px;font-family:var(--sans);font-size:0.7812rem;color:var(--mute)}
.imp{font-weight:700}
.imp.up{color:var(--up)}
.imp.down{color:var(--down)}
.imp.flat{color:var(--flat)}
.read{margin-left:auto;min-height:44px;display:inline-flex;align-items:center;font-weight:700;font-size:0.8438rem;color:var(--ink)}
.sidestory{padding:0 0 22px;margin-bottom:22px;border-bottom:1px solid var(--rule)}
.rest{margin-top:36px;padding-top:26px;border-top:3px double var(--ink);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:32px}

/* ---------- 기사 화면 ---------- */
.back{display:inline-flex;align-items:center;min-height:44px;font-family:var(--sans);font-size:0.8438rem;font-weight:700;text-decoration:none}
.art-wrap{display:flex;flex-wrap:wrap;align-items:flex-start;gap:36px 0;margin-top:6px}
.article{flex:999 1 560px;min-width:0;padding-right:40px;border-right:1px solid var(--rule)}
.article h2{margin:12px 0 0;font-size:clamp(28px,3.6vw,46px);font-weight:900;line-height:1.3;letter-spacing:-.015em;text-wrap:balance}
.byline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:18px;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);font-family:var(--sans);font-size:0.8125rem;color:var(--mute)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;border-bottom:1px solid var(--ink)}
.tab{min-height:44px;margin-bottom:-1px;padding:0 18px;background:none;border:none;border-bottom:3px solid transparent;font-family:var(--sans);font-size:0.9062rem;font-weight:500;color:var(--mute)}
.tab.on{border-bottom-color:var(--ink);font-weight:700;color:var(--ink)}
.tabbody{padding-top:28px}
.label{font-family:var(--sans);font-size:0.6875rem;font-weight:700;letter-spacing:.16em;color:var(--mute)}
.pull{margin:10px 0 34px;font-size:clamp(21px,2.2vw,27px);font-weight:700;line-height:1.65;text-wrap:pretty}
.bigpoints{list-style:none;margin:0;padding:0}
.bigpoints li{display:flex;align-items:baseline;gap:18px;padding:16px 0;border-bottom:1px solid var(--rule)}
.bigpoints b{flex:none;width:28px;font-size:1.75rem;font-weight:900;line-height:1}
.bigpoints span{font-size:1.0312rem;line-height:1.8}
.cols{max-width:42em}
.cols p{margin:0 0 1.15em;font-size:1.0625rem;line-height:1.9;text-align:left;word-break:keep-all;overflow-wrap:break-word}
.pairhead,.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:32px}
.pairhead{padding-bottom:8px;border-bottom:1px solid var(--ink)}
.pair{padding:20px 0;border-bottom:1px solid var(--rule)}
.pair p{margin:0;font-size:0.9688rem;line-height:1.95;word-break:keep-all}
.pair p.eng{font-size:0.9062rem;line-height:1.85;color:#3A3832;word-break:normal}
.prevnext{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px;margin-top:36px}
.prevnext a{display:block;padding:14px 16px;border:1px solid var(--rule);text-decoration:none;font-size:0.9375rem;font-weight:700;line-height:1.5}
.prevnext a small{display:block;font-family:var(--sans);font-size:0.7188rem;font-weight:700;letter-spacing:.1em;color:var(--mute);margin-bottom:4px}
.prevnext a.next{text-align:right}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;margin-top:36px;padding-top:18px;border-top:3px double var(--ink)}
.foot span{font-family:var(--sans);font-size:0.7812rem;color:var(--mute)}
.rail{flex:1 1 260px;min-width:0;padding-left:32px}
.rail .item{padding:16px 0;border-bottom:1px solid var(--rule)}
.rail .item a{display:block;margin-top:6px;font-size:1.0625rem;font-weight:700;line-height:1.5;text-decoration:none}
.rail .item a:hover{text-decoration:underline}

/* ---------- 등록 화면 ---------- */
.formwrap{max-width:900px}
.formwrap h2{margin:0;font-size:1.625rem;font-weight:900;letter-spacing:-.01em}
.formwrap .lede{margin:6px 0 24px;font-family:var(--sans);color:var(--mute)}
.box{padding:22px;border:1px solid var(--ink);background:var(--field);margin-bottom:28px}
.box h3{margin:0 0 6px;font-size:1.0625rem;font-weight:700}
.box p{margin:0 0 14px;font-family:var(--sans);font-size:0.8438rem;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:20px}
.fld{margin-bottom:22px}
.fld>label,.fld>.lab{display:block;margin-bottom:6px;font-family:var(--sans);font-size:0.8125rem;font-weight:700}
.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:0;background:var(--field);color:var(--ink);font-family:var(--sans);font-size:0.875rem}
textarea.inp{padding:12px;line-height:1.7;resize:vertical;min-height:120px}
.hint{margin-top:6px;font-family:var(--sans);font-size:0.7812rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:64px;padding:0 16px;border:1px solid var(--line);background:var(--field);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.8125rem;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line)}
.seg button{min-height:44px;padding:0 16px;border:none;background:var(--field);color:var(--ink);font-family:var(--sans);font-size:0.875rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:700}
.msg{margin:0 0 18px;padding:12px 14px;border:1px solid;font-family:var(--sans);font-size:0.8438rem;line-height:1.6}
.msg.ok{border-color:#2F5D3A;background:#EAF2EA;color:#1F4029}
.msg.warn{border-color:#8A5A00;background:#FFF4D6;color:#5C4400}
.msg.err{border-color:#9B2C2C;background:#F9E7E4;color:#7A1F1F}
.msg.info{border-color:var(--line);background:var(--field);color:var(--ink)}
.msg a{font-weight:700}
.msg button{margin-left:8px;min-height:36px;padding:0 12px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:700}
.md h4{margin:1.6em 0 .5em;font-size:1.125rem;font-weight:900;line-height:1.5}
.md h4:first-child{margin-top:0}
.md ul{margin:0 0 1.3em;padding:0 0 0 1.2em}
.md li{margin:0 0 .5em;font-size:1.0625rem;line-height:1.85;text-align:left;word-break:keep-all}
.bigpoints strong{display:block;margin-bottom:4px;font-size:1.0625rem;line-height:1.6}
.adv{margin:0 0 6px;border-top:1px solid var(--rule);padding-top:8px}
.adv summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-family:var(--sans);font-size:0.8438rem;font-weight:700}
.adv[open] summary{margin-bottom:12px}
.empty{padding:80px 0;text-align:center;color:var(--mute);font-family:var(--sans)}
.empty strong{display:block;margin-bottom:10px;font-family:var(--serif);font-size:1.5rem;color:var(--ink)}
.empty .btn-solid{margin-top:22px}
.loading{padding:80px 0;text-align:center;color:var(--mute);font-family:var(--sans)}

/* ---------- 폭에 따른 배치: 960px 이하(폴드 펼침 화면, 태블릿 세로)에서는 한 단 배치 ---------- */
@media (max-width:959px){
  .wrap{padding:0 clamp(16px,3.4vw,28px)}
  .front{gap:0}
  .lead,.side,.article,.rail{flex:1 1 100%;min-width:0}
  .lead{padding-right:0}
  .lead.ruled{border-right:none}
  .side{padding-left:0;margin-top:28px;padding-top:24px;border-top:3px double var(--ink)}
  .article{padding-right:0;border-right:none}
  .rail{padding-left:0;margin-top:36px;padding-top:20px;border-top:3px double var(--ink)}
  main{padding:20px 0 48px}
  .datetools{margin-left:0;justify-content:center}
}
/* ---------- 휴대폰 폭(약 520px 이하): 조작 영역을 가로 전체로 ---------- */
@media (max-width:520px){
  .strip .right{width:100%}
  .search{flex:1 1 100%;width:100%}
  .datecenter{min-width:0;width:100%;order:-1}
  .navbtn{padding:0 11px}
  .tab{padding:0 14px}
  .prevnext{grid-template-columns:1fr}
  .prevnext a.next{text-align:left}
  .foot .btn-solid{width:100%;justify-content:center}
}
/* Responsive reading: cover / unfolded / desktop; no fixed device detection. */
html{text-size-adjust:100%;-webkit-text-size-adjust:100%}
.masthead h1{font-size:clamp(25px,4.5vw,58px)}
.lead .hl{font-size:clamp(21px,2.8vw,38px)}
.article h2{font-size:clamp(22px,3vw,40px)}
.pull{font-size:clamp(17px,1.9vw,24px)}
.search-headline{font-size:clamp(18px,2.1vw,22px)}
.strip .right,.datetools,.datetools label,.grid>*{min-width:0}
input,textarea,select{max-width:100%}
.cols,.pair p,.bigpoints span,.points span{overflow-wrap:anywhere}
@media (max-width:959px){
  .wrap{padding-inline:clamp(12px,2.6vw,24px)}
  .masthead{padding:16px 0 12px}
  .masthead h1{margin:6px 0;line-height:1.25}
  .lead .deck{font-size:1rem;line-height:1.7;margin-top:12px}
  .side .hl{font-size:1.2rem}
  .rest .hl{font-size:1.13rem}
  .points{margin-top:16px}
  .points li{gap:10px;padding:10px 0}
  .article h2{line-height:1.4;text-wrap:pretty}
  .tabbody{padding-top:20px}
  .pull{margin-bottom:24px;line-height:1.65}
  .cols p,.md li{font-size:1rem;line-height:1.8}
  .bigpoints span,.bigpoints strong{font-size:.9688rem;line-height:1.75}
  .bigpoints li{gap:12px;padding:12px 0}
  .bigpoints b{font-size:1.3rem;width:22px}
  .rest{gap:22px;margin-top:24px;padding-top:20px}
  .rail{margin-top:24px}
  .byline{gap:6px 12px;margin-top:14px}
}
/* Fold main screen: keep full articles continuous; use width for story lists. */
@media (min-width:600px) and (max-width:959px){
  .side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
  .side .sidestory{min-width:0}
  .side .sidestory:only-child{grid-column:1/-1}
  .rest{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{max-width:44em}
  .strip .right{flex:1;justify-content:flex-end}
  .search{width:clamp(190px,30vw,260px)}
}
/* Cover, ordinary phone, and narrow split-screen windows. */
@media (max-width:599px){
  .strip{gap:6px;padding:6px 0}
  .strip .right{width:100%;gap:8px}
  .search{flex:1 1 160px;width:auto}
  .strip .btn-solid,.strip .btn-line{padding-inline:10px;white-space:nowrap}
  .masthead .eyebrow{letter-spacing:.18em}
  .masthead .sub{font-size:.75rem}
  .datetitle{font-size:1.15rem}
  .datebar{gap:6px 8px;padding:8px 0}
  .datecenter{width:100%;min-width:0;order:-1}
  .datetools{width:100%;gap:6px;justify-content:center}
  .datebar button,.datebar .pill{padding-inline:10px}
  .navbtn{padding-inline:10px;font-size:.8438rem}
  .navright{width:100%;margin-left:0;border-top:1px solid var(--rule)}
  .navright .navbtn{padding-inline:9px}
  main{padding-top:16px}
  .side{margin-top:20px;padding-top:18px}
  .sidestory{padding-bottom:16px;margin-bottom:16px}
  .rest{grid-template-columns:minmax(0,1fr)}
  .tab{padding-inline:10px;font-size:.8438rem}
  .pairhead,.pair{gap:16px}
  .pair p{line-height:1.8}
  .box{padding:14px;margin-bottom:20px}
  .formwrap h2{font-size:1.35rem}
  .grid{gap:12px}
  .fld{margin-bottom:16px}
  .seg button,.chip{padding-inline:12px}
}

.link-status{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);width:max-content;padding:12px 18px;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:.875rem;z-index:1000;box-shadow:0 3px 14px #0003}
.link-dialog{width:min(480px,calc(100% - 24px));max-height:85vh;overflow:auto;padding:20px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);font-family:var(--sans)}
.link-dialog::backdrop{background:#0006}
.link-dialog h2{font-size:1.2rem;margin-top:0}
.link-dialog p,.link-dialog label{font-size:.875rem}
.link-dialog input{margin:8px 0 16px}
/* Compact mobile reading: reduce text and vertical rhythm, retain touch targets. */

  // 브라우저 저장소 지우기
  function cacheDel(key) { try { localStorage.removeItem(STORE + key); } catch (e) { /* 무시 */ } }
  // 단순 값 저장/읽기 (탭 기억, 등록 키 기억 등)
  function setPref(k, v) { try { localStorage.setItem(STORE + 'pref:' + k, v); } catch (e) { /* 무시 */ } }
  function getPref(k) { try { return localStorage.getItem(STORE + 'pref:' + k) || ''; } catch (e) { return ''; } }
  // ---------- 관리자 로그인 상태 (비밀번호 = 등록 키) ----------
  // 저장된 비밀번호: 이 탭에서만(sessionStorage) 또는 이 브라우저에 계속(localStorage)
  function getKey() { try { return sessionStorage.getItem(STORE + 'sess:key') || localStorage.getItem(STORE + 'pref:key') || ''; } catch (e) { return ''; } }
  // 로그인 성공 시 저장 (keep 이 true 이면 브라우저에 계속 유지)
  function setKey(key, keep) { try { sessionStorage.setItem(STORE + 'sess:key', key); } catch (e) { /* 무시 */ } setPref('key', keep ? key : ''); }
  // 로그아웃: 저장된 비밀번호를 모두 지움
  function clearKey() { try { sessionStorage.removeItem(STORE + 'sess:key'); } catch (e) { /* 무시 */ } setPref('key', ''); }
  // 관리자 여부 (샘플 모드에서는 화면 확인을 위해 항상 true)
  function isAdmin() { return DEMO || !!getKey(); }
  // 핵심 요약·시사점을 [{head, body}] 모양으로 통일 (예전 글자 배열도 받아들임)
  function normPts(arr) { return (arr || []).map(function (p) { return typeof p === 'string' ? { head: '', body: p } : { head: p.head || '', body: p.body || '' }; }); }
  // 기사 한 건의 빠진 항목을 기본값으로 채움
  function normArticle(a) {
    a.points = normPts(a.points); a.insights = normPts(a.insights);
    if (a.bodyKo == null && a.paragraphsKo) a.bodyKo = a.paragraphsKo.join('\n\n');
    a.bodyKo = a.bodyKo || ''; a.paragraphsEn = a.paragraphsEn || []; a.author = a.author || ''; a.updatedAt = a.updatedAt || '';
    return a;
  }
  // 서버 응답 안의 기사들을 모두 통일
  function normRes(res) {
    if (res && res.ok) { if (res.articles) res.articles.forEach(normArticle); if (res.article) normArticle(res.article); }
    return res;
  }
  // 중요도 높은 순, 같으면 id 큰(나중에 등록된) 순으로 정렬
  function sortStories(list) {
    return list.slice().sort(function (a, b) {
      const ra = RANK[a.importance] == null ? 9 : RANK[a.importance];
      const rb = RANK[b.importance] == null ? 9 : RANK[b.importance];
      return ra - rb || (a.id < b.id ? 1 : -1);
    });
  }

  // =====================================================================
  // 4. 서버 통신
  // =====================================================================
  // JSONP 읽기: 서버가 callback 이름으로 감싸서 보내 주는 방식 (fetch 가 막힐 때의 대비책)
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      // 겹치지 않는 임시 함수 이름
      const name = '__newsCb' + Date.now() + Math.floor(Math.random() * 1000);
      // 스크립트 태그 만들기
      const s = document.createElement('script');
      // 정리 함수: 타이머, 임시 함수, 태그 제거
      function cleanup() { clearTimeout(timer); delete window[name]; if (s.parentNode) s.parentNode.removeChild(s); }
      // 15초 안에 응답이 없으면 실패 처리
      const timer = setTimeout(function () { cleanup(); reject(new Error('시간 초과')); }, 15000);
      // 서버가 이 함수를 호출하면서 데이터를 전달
      window[name] = function (data) { cleanup(); resolve(data); };
      // 불러오기 실패 처리
      s.onerror = function () { cleanup(); reject(new Error('불러오지 못했습니다')); };
      // 주소 뒤에 callback 이름을 붙여 요청
      s.src = url + '&callback=' + name;
      document.head.appendChild(s);
    });
  }
  // 읽기 요청
  async function apiGet(params) {
    if (DEMO) return normRes(await demoGet(params));
    const url = API_URL + (API_URL.indexOf('?') >= 0 ? '&' : '?') + new URLSearchParams(params).toString();
    let res;
    try { res = await fetch(url, { method: 'GET', redirect: 'follow' }); }
    catch (e) {
      // 브라우저가 fetch 를 막는 경우(CORS)에는 스크립트 태그 방식(JSONP)으로 한 번 더 시도
      try { return normRes(await jsonp(url)); }
      catch (e2) { throw new Error('서버에 연결할 수 없습니다. 인터넷 연결과 웹앱 주소(API_URL)를 확인하세요.'); }
    }
    if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
    try { return normRes(await res.json()); }
    catch (e) { throw new Error('서버 응답을 읽을 수 없습니다. 웹앱 배포 설정(액세스: 모든 사용자)을 확인하세요.'); }
  }
  // 등록 요청 (본문을 글자로 보내 브라우저의 사전 확인 요청을 피함)
  async function apiPost(body) {
    if (DEMO) return { ok: false, code: 'DEMO', message: '샘플 모드입니다. 웹앱 배포 주소를 index.html의 API_URL에 넣으면 저장할 수 있습니다.' };
    let res;
    try { res = await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify(body) }); }
    catch (e) { return { ok: false, code: 'NETWORK', message: '서버에 연결할 수 없습니다. 인터넷 연결과 웹앱 주소(API_URL)를 확인하세요.' }; }
    try { return await res.json(); }
    catch (e) { return { ok: false, code: 'BAD_RESPONSE', message: '서버 응답을 읽을 수 없습니다. 저장되었는지 시트에서 확인하세요.' }; }
  }

  // =====================================================================
  // 5. 화면 상태
  // =====================================================================
  const state = {
    view: 'front',      // front(1면) / article(기사) / search(검색) / write(등록)
    dates: [],          // 기사가 있는 날짜 목록 [{date, count}]
    datesReady: false,  // 날짜 목록을 불러왔는지
    date: null,         // 지금 보는 날짜
    edition: [],        // 지금 보는 한 판의 기사 목록(가벼운 정보)
    editionDate: null,  // edition 이 어느 날짜의 것인지
    tag: 'ALL',         // 품목 필터
    impact: 'ALL',      // 가격영향 필터
    article: null,      // 열어 둔 기사(전문 포함)
    tab: getPref('tab') || 'summary', // 마지막으로 본 탭을 기억
    results: null,      // 검색 결과
    query: '',          // 검색어
    loading: false,     // 불러오는 중인지
    error: ''           // 오류 안내문
  };
  // 화면 전환 중 오래된 요청의 결과가 덮어쓰지 않도록 쓰는 번호표
  let ticket = 0;

  // =====================================================================
  // 6. 데이터 불러오기
  // =====================================================================
  // 날짜 목록 불러오기 (브라우저 저장본이 있으면 먼저 쓰고, 뒤에서 갱신)
  async function ensureDates(force) {
    if (state.datesReady && !force) return;
    const cached = force ? null : cacheRead('dates', TTL_FRESH);
    if (cached) { state.dates = cached; state.datesReady = true; return; }
    const res = await apiGet({ action: 'dates' });
    if (!res.ok) throw new Error(res.message || '날짜 목록을 불러오지 못했습니다.');
    state.dates = res.dates; state.datesReady = true;
    cacheWrite('dates', res.dates);
  }
  // 하루 한 판 불러오기
  async function loadEdition(date, force, myTicket) {
    const key = 'ed:' + date;
    const isPast = date < todayStr();
    // 지난 호는 오래 보관, 오늘 호는 일단 저장본을 보여 주고 곧바로 새로 받아 확인
    const cached = force ? null : cacheRead(key, isPast ? TTL_PAST : 24 * 3600 * 1000);
    if (cached) {
      state.edition = cached.map(normArticle); state.editionDate = date;
      if (myTicket === ticket) render();
      if (isPast) return;
    }
    const res = await apiGet({ action: 'edition', date: date });
    if (myTicket !== ticket) return;
    if (!res.ok) { if (!cached) throw new Error(res.message || '기사를 불러오지 못했습니다.'); return; }
    state.edition = res.articles; state.editionDate = date;
    cacheWrite(key, res.articles);
  }
  // 기사 한 건 불러오기
  async function loadArticle(id) {
    const cached = cacheRead('ar:' + id, TTL_PAST);
    if (cached) return normArticle(cached);
    const res = await apiGet({ action: 'article', id: id });
    if (!res.ok) throw new Error(res.message || '기사를 불러오지 못했습니다.');
    cacheWrite('ar:' + id, res.article);
    return res.article;
  }

  // =====================================================================
  // 7. 화면 이동(주소의 # 부분으로 구분)
  //    #/            : 최신 호 1면      #/d/2026-11-01 : 해당 날짜 1면
  //    #/a/기사번호   : 기사            #/s/검색어     : 검색
  //    #/write       : 등록
  // =====================================================================
  async function route() {
    const my = ++ticket;
    const parts = location.hash.replace(/^#\/?/, '').split('/');
    state.error = '';
    try {
      if (parts[0] === 'write') return showWrite();
      if (parts[0] === 'a' && parts[1]) return await showArticle(parts[1], my);
      if (parts[0] === 's' && parts[1]) return await showSearch(decodeURIComponent(parts.slice(1).join('/')), my);
      return await showFront(parts[0] === 'd' && parts[1] ? parts[1] : null, my);
    } catch (e) {
      if (my !== ticket) return;
      state.loading = false; state.error = e.message || '불러오는 중 문제가 생겼습니다.';
      render();
    }
  }
  // 1면 보여주기
  async function showFront(date, my) {
    state.view = 'front'; state.loading = true;
    if ($('#q').value) $('#q').value = '';
    await ensureDates(false);
    if (my !== ticket) return;
    state.date = date || (state.dates.length ? state.dates[state.dates.length - 1].date : todayStr());
    if (state.editionDate !== state.date) { state.edition = []; state.editionDate = null; }
    render();
    await loadEdition(state.date, false, my);
    if (my !== ticket) return;
    state.loading = false; render();
  }
  // 기사 보여주기
  async function showArticle(id, my) {
    state.view = 'article'; state.article = null; state.loading = true;
    if ($('#q').value) $('#q').value = '';
    render();
    const art = await loadArticle(id);
    if (my !== ticket) return;
    state.article = art; state.date = art.date; render();
    // 같은 날 기사 목록은 '이전/다음 기사'와 '다른 기사'에 쓰임
    if (state.editionDate !== art.date) await loadEdition(art.date, false, my).catch(function () { /* 목록이 없어도 기사는 볼 수 있음 */ });
    if (my !== ticket) return;
    state.loading = false; render();
    window.scrollTo(0, 0);
  }
  // 검색 결과 보여주기
  async function showSearch(q, my) {
    state.view = 'search'; state.query = q; state.results = null; state.loading = true;
    if ($('#q').value !== q) $('#q').value = q;
    render();
    const res = await apiGet({ action: 'search', q: q });
    if (my !== ticket) return;
    if (!res.ok) throw new Error(res.message || '검색하지 못했습니다.');
    state.results = res.articles; state.loading = false; render();
  }
  // 등록 화면 보여주기
  function showWrite() {
    state.view = 'write'; state.loading = false;
    if ($('#q').value) $('#q').value = '';
    render();
    window.scrollTo(0, 0);
  }

  // =====================================================================
  // 8. 화면 그리기
  // =====================================================================
  function render() {
    $('#logoutBtn').hidden = DEMO || !getKey();
    $('#modeNote').textContent = DEMO ? '※ 샘플 모드: API_URL 을 설정하면 구글시트 데이터가 표시됩니다' : '';
    renderDateBar(); renderNav();
    const main = $('#main');
    if (state.error) { main.innerHTML = '<div class="msg err">' + esc(state.error) + '</div>'; return; }
    if (state.view === 'front') main.innerHTML = frontHtml();
    else if (state.view === 'article') main.innerHTML = articleHtml();
    else if (state.view === 'search') main.innerHTML = searchHtml();
    else if (state.view === 'write') main.innerHTML = writeHtml();
  }

  // ---------- 날짜 이동 줄 ----------
  function renderDateBar() {
    const el = $('#dateBar');
    if (state.view !== 'front' || !state.date) { el.innerHTML = ''; return; }
    const ds = state.dates.map(function (d) { return d.date; });
    const prev = ds.filter(function (d) { return d < state.date; }).pop();
    const next = ds.find(function (d) { return d > state.date; });
    const latest = ds[ds.length - 1];
    const ready = state.editionDate === state.date;
    const note = ready ? state.edition.length + '건' + (state.date === latest ? ' · 최신 호' : '') : '불러오는 중…';
    el.innerHTML = '<div class="datebar" role="group" aria-label="호 선택">' +
      '<button type="button" data-act="prev"' + (prev ? '' : ' disabled') + '>← 이전 호</button>' +
      '<div class="datecenter"><div class="datetitle">' + dateLabel(state.date) + '</div><div class="datenote">' + note + '</div></div>' +
      '<button type="button" data-act="next"' + (next ? '' : ' disabled') + '>다음 호 →</button>' +
      '<span class="datetools"><label>날짜 선택 <input type="date" id="pickDate" value="' + state.date + '"' + (ds.length ? ' min="' + ds[0] + '" max="' + latest + '"' : '') + '></label>' +
      '<button type="button" data-act="latest">최신 호</button><button type="button" data-act="refresh">↻ 새로고침</button></span></div>';
  }

  // ---------- 품목·가격영향 메뉴 ----------
  function renderNav() {
    const el = $('#nav');
    if (state.view !== 'front' || !state.date) { el.innerHTML = ''; return; }
    const base = state.editionDate === state.date ? state.edition : [];
    const tagBtns = ['ALL'].concat(TAGS).map(function (k) {
      const n = k === 'ALL' ? base.length : base.filter(function (a) { return a.tags.indexOf(k) >= 0; }).length;
      return '<button type="button" class="navbtn' + (state.tag === k ? ' on' : '') + '" data-act="tag" data-v="' + k + '" aria-pressed="' + (state.tag === k) + '">' + (k === 'ALL' ? '전체' : k) + ' <small>' + n + '</small></button>';
    }).join('');
    const impBtns = [['ALL', '전체'], ['상승', '상승 요인'], ['하락', '하락 요인'], ['중립', '중립']].map(function (p) {
      return '<button type="button" class="navbtn' + (state.impact === p[0] ? ' on' : '') + '" data-act="impact" data-v="' + p[0] + '" aria-pressed="' + (state.impact === p[0]) + '">' + p[1] + '</button>';
    }).join('');
    el.innerHTML = '<div class="nav">' + tagBtns + '<span class="navright"><span class="navlabel">가격 영향</span>' + impBtns + '</span></div>';
  }

  // ---------- 공통 조각 ----------
  function kickerHtml(a, withDate) { return '<div class="kicker">' + esc(a.tags.join(' · ')) + (withDate ? '&nbsp;&nbsp;&nbsp;' + dots(a.date) : '') + '</div>'; }
  function metaHtml(a, withSource) {
    const m = impactOf(a);
    return '<div class="meta">' + (withSource ? '<span>' + esc(a.source) + '</span>' : '') + '<span class="imp ' + m.cls + '">' + m.arrow + ' ' + m.label + '</span><span>중요도 ' + esc(a.importance) + '</span></div>';
  }
  function linkHtml(a) { return '<a href="#/a/' + encodeURIComponent(a.id) + '">' + esc(a.titleKo) + '</a>'; }
  function emptyHtml(title, desc, extra) { return '<div class="empty"><strong>' + esc(title) + '</strong>' + esc(desc) + (extra || '') + '</div>'; }

  // ---------- 1면 ----------
  function frontHtml() {
    if (state.loading && state.editionDate !== state.date) return '<div class="loading">불러오는 중…</div>';
    if (state.datesReady && !state.dates.length) return emptyHtml('아직 등록된 기사가 없습니다', '새 뉴스 등록 화면에서 첫 기사를 저장해 보세요.', '<br><a class="btn-solid" href="#/write">새 뉴스 등록</a>');
    const list = sortStories(state.edition.filter(function (a) {
      return (state.tag === 'ALL' || a.tags.indexOf(state.tag) >= 0) && (state.impact === 'ALL' || a.impact === state.impact);
    }));
    if (!list.length) {
      if (state.edition.length === 0) {
        const earlier = state.dates.map(function (d) { return d.date; }).filter(function (d) { return d < state.date; }).pop();
        return emptyHtml('이날은 수집된 기사가 없습니다', '주말이나 휴일에는 기사가 없을 수 있습니다.', earlier ? '<br><a class="btn-solid" href="#/d/' + earlier + '">' + dots(earlier) + ' 호 보기</a>' : '');
      }
      return emptyHtml('조건에 맞는 기사가 없습니다', '품목이나 가격 영향 필터를 바꿔 보세요.');
    }
    const lead = list[0], side = list.slice(1, 3), rest = list.slice(3);
    let h = '<div class="front"><article class="lead' + (side.length ? ' ruled' : '') + '">' + kickerHtml(lead, true) +
      '<h2 class="hl">' + linkHtml(lead) + '</h2>' + (lead.titleEn ? '<p class="en">' + esc(lead.titleEn) + '</p>' : '') +
      '<p class="deck">' + esc(lead.oneLine) + '</p><ol class="points">' +
      lead.points.map(function (t, i) { return '<li><b>' + (i + 1) + '</b><span>' + esc(t.head || t.body) + '</span></li>'; }).join('') + '</ol>' +
      '<div class="meta">' + metaHtml(lead, true).replace('<div class="meta">', '').replace(/<\/div>$/, '') +
      '<a class="read" href="#/a/' + encodeURIComponent(lead.id) + '">기사 전문 읽기 →</a></div></article>';
    if (side.length) {
      h += '<div class="side">' + side.map(function (a) {
        return '<article class="sidestory">' + kickerHtml(a, true) + '<h3 class="hl">' + linkHtml(a) + '</h3><p class="deck">' + esc(a.oneLine) + '</p>' + metaHtml(a, false) + '</article>';
      }).join('') + '</div>';
    }
    h += '</div>';
    if (rest.length) {
      h += '<div class="rest">' + rest.map(function (a) {
        return '<article>' + kickerHtml(a, true) + '<h3 class="hl">' + linkHtml(a) + '</h3><p class="deck">' + esc(a.oneLine) + '</p>' + metaHtml(a, false) + '</article>';
      }).join('') + '</div>';
    }
    return h;
  }

  // ---------- 기사 화면 ----------
  // 글 속의 **굵은 글씨**만 강조로 바꾸고 나머지는 모두 안전하게 이스케이프
  function inlineMd(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  // 전문 해석(마크다운)을 HTML로 변환: 빈 줄로 나뉜 덩어리마다 목록, 소제목, 문단으로 처리
  function mdHtml(md) {
    return String(md || '').replace(/\r/g, '').split(/\n\s*\n/).map(function (block) {
      const ls = block.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      if (!ls.length) return '';
      // 모든 줄이 '* ' 또는 '- ' 로 시작하면 목록
      if (ls.every(function (x) { return /^[*-]\s+/.test(x); })) {
        return '<ul>' + ls.map(function (x) { return '<li>' + inlineMd(x.replace(/^[*-]\s+/, '')) + '</li>'; }).join('') + '</ul>';
      }
      // 한 줄 전체가 **굵은 글씨**이면 소제목
      if (ls.length === 1 && /^\*\*(.+)\*\*$/.test(ls[0])) return '<h4>' + inlineMd(ls[0].replace(/^\*\*(.+)\*\*$/, '$1')) + '</h4>';
      // 그 밖에는 문단
      return '<p>' + inlineMd(ls.join(' ')) + '</p>';
    }).join('');
  }
  // 마크다운을 문단별 일반 글로 나눔 (영어 원문과 문단끼리 짝지을 때 사용)

    }).filter(Boolean);

  // ---------- 마켓 브리프 형식 해석 ----------
  // 글 속의 ** 표시 제거
  function stripBold(s) { return String(s || '').replace(/\*\*/g, '').trim(); }
  // 목록 줄들을 [{head, body}] 로 변환: '* **제목**: 본문' 한 줄형, 또는 제목 줄 아래에 본문이 이어지는 형태 모두 처리
  function parseItems(lines) {
    const items = []; let current = null;
    lines.forEach(function (line) {
      const t = line.trim();
      if (!t || /^-{3,}$/.test(t)) { current = null; return; }
      const bullet = t.match(/^(?:[*•●▪-]|\d+[.)])\s+(.+)$/);
      if (bullet || !current) {
        const text = stripBold(bullet ? bullet[1] : t);
        const pair = text.match(/^([^:：]{1,100})[:：]\s*(.*)$/);
        current = pair ? { head: pair[1].trim(), body: pair[2].trim() } : { head: '', body: text };
        items.push(current);
      } else current.body += (current.body ? ' ' : '') + stripBold(t);
    });
    return items;
  }
  // 앞뒤의 빈 줄과 --- 구분선 제거
  function trimSep(lines) {
    const out = lines.slice();
    const isSep = function (l) { return !l.trim() || /^-{3,}$/.test(l.trim()); };
    while (out.length && isSep(out[0])) out.shift();
    while (out.length && isSep(out[out.length - 1])) out.pop();
    return out;
  }
  // 번역 결과 전체를 해석해 제목, 날짜, 작성자, 핵심 요약, 시사점, 전체 내용으로 나눔
  function parseBrief(raw) {
    const lines = String(raw || '').replace(/\r/g, '').split('\n');
    const out = { title: '', category: '', meta: {}, summary: [], insights: [], full: '', extra: {} };
    const clean = function (l) { return stripBold(l).replace(/^#{1,6}\s*/, '').trim(); };
    const metaRe = /^(?:[*•●▪-]\s*)?(발행일시|최종\s*업데이트|작성자|출처|매체|Source|Publisher)\s*[:：]\s*(.+)$/i;
    const section = function (l) {
      const t = clean(l).replace(/^\d+\s*[.)]\s*/, '');
      if (/^(?:핵심\s*요약|요약|Executive Summary|Summary)(?:\s*\([^)]*\))?\s*[:：]?$/.test(t)) return 'summary';
      if (/^(?:시사점(?:\s*및\s*영향\s*분석)?|영향\s*분석|Key Takeaways)(?:\s*\([^)]*\))?\s*[:：]?$/.test(t)) return 'insights';
      if (/^(?:전체\s*내용|전문(?:\s*해석)?|Full Translation)(?:\s*\([^)]*\))?\s*[:：]?$/.test(t)) return 'full';
      return '';
    };
    const extraRe = /^(?:[*•●▪-]\s*)?(품목|가격\s*영향|중요도)\s*[:：]\s*(.+)$/;
    for (let k = lines.length - 1, seen = 0; k >= 0 && seen < 10; k--) {
      if (!lines[k].trim()) continue;
      seen++;
      const m = clean(lines[k]).match(extraRe);
      if (m) { out.extra[m[1].replace(/\s/g, '')] = m[2]; lines.splice(k, 1); }
    }
    const sections = { summary: [], insights: [], full: [] }; let current = '';
    lines.forEach(function (line) {
      const t = clean(line); const sec = section(line);
      if (sec) { current = sec; return; }
      // Metadata is read only before the article sections, never from quoted body text.
      if (!current) {
        const m = t.match(metaRe);
        if (m) { out.meta[/^(출처|매체|Source|Publisher)$/i.test(m[1]) ? '출처' : m[1].replace(/\s/g, '')] = m[2]; return; }
        if (!out.title && t && !/^[-`]{3,}/.test(t)) {
          const title = t.match(/^\[(.+?)\]\s*(.*)$/);
          out.category = title ? title[1] : ''; out.title = title ? title[2] : t;
        }
      } else sections[current].push(line);
    });
    out.summary = parseItems(trimSep(sections.summary));
    out.insights = parseItems(trimSep(sections.insights));
    out.full = trimSep(sections.full).join('\n');
    return out;
  }
  // Explicit source takes priority. Infer only from title/author, not publishers mentioned in the body.
  function detectSource(brief) {
    const rules = [['ICIS', /\bICIS\b|아이시스/i], ['Platts', /\bPlatts\b|S\s*&\s*P Global|플래츠/i], ['Argus', /\bArgus\b|아르거스/i], ['Reuters', /\bReuters\b|로이터/i], ['Bloomberg', /\bBloomberg\b|블룸버그/i], ['연합뉴스', /연합뉴스|\bYonhap\b/i]];
    const explicit = brief.meta['출처'];
    const text = explicit || [brief.title, brief.category, brief.meta['작성자'] || ''].join(' ');
    const found = rules.filter(function (rule) { return rule[1].test(text); });
    if (explicit) return found.length === 1 ? found[0][0] : explicit;
    return found.length === 1 ? found[0][0] : '';
  }
  // 본문에서 품목을 추정 (맞는 것이 없으면 기타)
  function detectTags(text) {
    const rules = [['SM', /스티렌|styrene|\bSM\b/i], ['AN', /아크릴로니트릴|acrylonitrile|\bAN\b/], ['BD', /부타디엔|butadiene|\bBD\b/i], ['MMA', /\bMMA\b|메틸메타크릴/i], ['BPA', /\bBPA\b|비스페놀/i]];
    const found = rules.filter(function (r) { return r[1].test(text); }).map(function (r) { return r[0]; });
    return found.length ? found : ['기타'];
  }
  // 번역 결과를 해석해 각 칸에 채우기
  function fillFromPaste() {
    const raw = fv('f-paste');
    if (!raw.trim()) { setMsg('warn', '붙여넣은 내용이 없습니다. 번역 결과 전체를 붙여넣으세요.'); return; }
    const r = parseBrief(raw);
    if (!r.title && !r.summary.length && !r.full) { setMsg('err', '내용을 찾지 못했습니다. 제목, 핵심 요약, 전체 내용이 있는지 확인하세요.'); return; }
    const found = [], missing = [];
    // 제목
    if (r.title) { setFv('f-titleKo', r.title); found.push('제목'); } else missing.push('제목');
    // 발행일시에서 날짜만 뽑아 기사 날짜로
    const dm = (r.meta['발행일시'] || '').match(/(\d{4})-(\d{2})-(\d{2})/);
    if (dm) { setFv('f-date', dm[1] + '-' + dm[2] + '-' + dm[3]); found.push('발행일 ' + dm[1] + '-' + dm[2] + '-' + dm[3]); } else missing.push('발행일(기사 날짜를 직접 확인)');
    if (r.meta['작성자']) { setFv('f-author', r.meta['작성자']); found.push('작성자'); }
    if (r.meta['최종업데이트']) { setFv('f-updated', r.meta['최종업데이트']); found.push('최종 업데이트'); }
    // 핵심 요약
    const toLines = function (list) { return list.map(function (i) { return i.head ? i.head + '||' + i.body : i.body; }).join('\n'); };
    if (r.summary.length) {
      setFv('f-points', toLines(r.summary));
      setFv('f-oneLine', r.summary[0].body || r.summary[0].head);
      found.push('핵심 요약 ' + r.summary.length + '개');
    } else missing.push('핵심 요약');
    // 시사점
    if (r.insights.length) { setFv('f-insights', toLines(r.insights)); found.push('시사점 ' + r.insights.length + '개'); }
    // 전체 내용(전문 해석)
    if (r.full) { setFv('f-bodyKo', r.full); found.push('전문 해석 ' + r.full.length.toLocaleString('ko-KR') + '자'); } else missing.push('전체 내용(전문 해석)');
    // 출처 추정
    const source = detectSource(r);
    setFv('f-source', source);
    if (source) found.push('출처 ' + source); else missing.push('출처(직접 입력)');
    // 품목, 가격영향, 중요도: 끝줄에 있으면 그 값, 없으면 품목만 추정
    const tagText = r.extra['품목'] ? r.extra['품목'].split(/[,\s]+/).map(function (t) { return t.trim().toUpperCase(); }) : detectTags(raw);
    setChips(tagText.filter(function (t) { return TAGS.indexOf(t) >= 0; }));
    const tagNote = r.extra['품목'] ? '' : ' (품목 ' + tagText.join(', ') + ' 추정)';
    if (IMPACT[r.extra['가격영향']]) setSeg('impact', r.extra['가격영향']);
    if (RANK[r.extra['중요도']] != null) setSeg('importance', r.extra['중요도']);
    const needPick = [];
    if (!IMPACT[r.extra['가격영향']]) needPick.push('가격 영향');
    if (RANK[r.extra['중요도']] == null) needPick.push('중요도');
    setMsg(missing.length ? 'warn' : 'info', '인식: ' + esc(found.join(', ')) + esc(tagNote) + '.' + (missing.length ? ' <b>찾지 못한 항목:</b> ' + esc(missing.join(', ')) + '.' : '') + (needPick.length ? ' <b>' + needPick.join('과 ') + '</b>는 형식에 없어서 직접 골라 주세요.' : ''));
  }
  // 글자를 클립보드에 복사 (실패하면 선택 방식으로 대체)
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      document.body.removeChild(ta); return ok;
    }
  }
  // Canonical public URL: keep the current route, exclude WebView/cache query parameters.
  let linkStatusTimer;
  async function copyPageLink() {
    const url = 'https://jskimlam.github.io/news-insight/' + (location.hash || '#/');
    const button = $('#copyLinkBtn');
    button.disabled = true;
    const ok = await copyText(url);
    button.disabled = false;
    const status = $('#linkStatus');
    clearTimeout(linkStatusTimer);
    if (ok) {
      status.textContent = '현재 페이지 링크를 복사했습니다.';
      status.hidden = false;
      linkStatusTimer = setTimeout(function () { status.hidden = true; }, 3000);
    } else {
      status.hidden = true;
      const input = $('#shareLink'), dialog = $('#linkDialog');
      input.value = url;
      if (!dialog.open) dialog.showModal();
      input.focus(); input.select();
    }
  }
  // 저장하기
  async function submitForm(force) {
    const f = readForm(); const key = getKey();
    if (!key && !DEMO) { clearKey(); render(); return; }
    if (!f.titleKo || !f.oneLine || !f.points.trim() || !f.bodyKo.trim()) { setMsg('err', '한글 제목, 한 줄 요약, 핵심 요약, 전문 해석은 꼭 있어야 합니다. 번역 결과를 붙여넣고 자동 채우기를 누르세요.'); return; }
    setMsg('info', '저장하는 중입니다…');
    // Apps Script 가 예전 코드이면 새 항목이 깨져 저장되므로, 저장 전에 버전을 확인
    if (!DEMO) {
      try {
        const pv = await apiGet({ action: 'ping' });
        if (!pv.ok || (pv.version || 1) < 2) { setMsg('err', 'Apps Script가 예전 버전입니다. 새 Code.gs로 교체한 뒤 [배포 관리]에서 새 버전으로 다시 배포하세요. (저장하지 않았습니다)'); return; }
      } catch (e) { setMsg('err', esc(e.message)); return; }
    }
    const res = await apiPost({ key: key, force: !!force, article: f });
    if (res.ok) {
      setPref('source', f.source);
      // 이 날짜의 저장본을 지워 다음에 새로 받도록 함
      cacheDel('ed:' + res.date); cacheDel('dates'); state.datesReady = false; state.editionDate = null;
      setMsg('ok', '저장했습니다. (' + esc(res.id) + ') <a href="#/a/' + encodeURIComponent(res.id) + '">기사 보기</a> · <a href="#/d/' + res.date + '">' + dots(res.date) + ' 1면 보기</a>');
      resetForm(true);
      window.scrollTo(0, 0);
    } else if (res.code === 'BAD_KEY') {
      // 비밀번호가 바뀐 경우: 로그아웃하고 잠금 화면으로
      clearKey(); render();
      const lm = $('#lockMsg'); if (lm) lm.innerHTML = '<div class="msg err">비밀번호가 바뀌었습니다. 다시 입력하세요.</div>';
    } else if (res.code === 'DUPLICATE') {
      setMsg('warn', esc(res.message) + ' <button type="button" data-act="force-submit">그래도 저장</button>');
    } else {
      setMsg('err', esc(res.message || '저장하지 못했습니다.'));
    }
  }
  // 잠금 화면에서 비밀번호 확인
  async function unlock() {
    const key = fv('lock-key');
    const msg = function (k, t) { const el = $('#lockMsg'); if (el) el.innerHTML = t ? '<div class="msg ' + k + '">' + t + '</div>' : ''; };
    if (!key) { msg('err', '비밀번호를 입력하세요.'); return; }
    msg('info', '확인하는 중입니다…');
    // Apps Script 가 예전 코드이면 확인 요청을 이해하지 못하므로 버전부터 확인
    try {
      const pv = await apiGet({ action: 'ping' });
      if (!pv.ok || (pv.version || 1) < 3) { msg('err', 'Apps Script가 예전 버전입니다. 새 Code.gs로 교체한 뒤 [배포 관리]에서 새 버전으로 다시 배포하세요.'); return; }
    } catch (e) { msg('err', esc(e.message)); return; }
    const res = await apiPost({ action: 'auth', key: key });
    if (res.ok) { setKey(key, $('#lock-keep').checked); render(); window.scrollTo(0, 0); }
    else msg('err', esc(res.message || '확인하지 못했습니다.'));
  }
  // 기사 화면에서 중요도·가격영향·품목 태그 수정
  async function saveClass() {
    const a = state.article; if (!a) return;
    const tags = Array.prototype.map.call(document.querySelectorAll('#adm [data-chip].on'), function (b) { return b.dataset.chip; });
    const segv = function (g) { const b = document.querySelector('#adm [data-seg="' + g + '"].on'); return b ? b.dataset.v : ''; };
    const msg = function (k, t) { const el = $('#editMsg'); if (el) el.innerHTML = t ? '<div class="msg ' + k + '">' + t + '</div>' : ''; };
    msg('info', '저장하는 중입니다…');
    if (!DEMO) {
      try {
        const pv = await apiGet({ action: 'ping' });
        if (!pv.ok || (pv.version || 1) < 3) { msg('err', 'Apps Script가 예전 버전입니다. 새 Code.gs로 교체한 뒤 새 버전으로 다시 배포하세요.'); return; }
      } catch (e) { msg('err', esc(e.message)); return; }
    }
    const res = await apiPost({ action: 'update', key: getKey(), id: a.id, impact: segv('impact'), importance: segv('importance'), tags: tags });
    if (res.ok) {
      const nt = tags.length ? tags : ['기타'];
      // 화면 데이터와 저장본에도 바로 반영
      a.impact = segv('impact'); a.importance = segv('importance'); a.tags = nt;
      state.edition = state.edition.map(function (x) { return x.id === a.id ? Object.assign({}, x, { impact: a.impact, importance: a.importance, tags: nt }) : x; });
      cacheDel('ed:' + a.date); cacheDel('ar:' + a.id);
      render();
      const d = $('#adm'); if (d) d.open = true;
      msg('ok', '수정했습니다. 1면 머리기사 순서에 바로 반영됩니다.');
    } else if (res.code === 'BAD_KEY') {
      clearKey();
      msg('err', '비밀번호가 바뀌었습니다. 새 뉴스 등록 화면에서 다시 로그인하세요.');
    } else {
      msg('err', esc(res.message || '저장하지 못했습니다.'));
    }
  }
  // 칸 비우기 (날짜·출처는 유지)
  function resetForm(keepMsg) {
    ['f-titleEn', 'f-titleKo', 'f-url', 'f-oneLine', 'f-points', 'f-insights', 'f-bodyKo', 'f-bodyEn', 'f-author', 'f-updated', 'f-paste'].forEach(function (id) { setFv(id, ''); });
    setChips([]); setSeg('impact', '중립'); setSeg('importance', '보통');
    if (!keepMsg) setMsg('', '');
  }

  // =====================================================================
  // 10. 이벤트 연결 (화면 전체에서 한 번만 연결)
  // =====================================================================
  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act, v = t.dataset.v;
    const ds = state.dates.map(function (d) { return d.date; });
    if (act === 'copy-link') { copyPageLink(); }
    else if (act === 'close-link') { $('#linkDialog').close(); $('#copyLinkBtn').focus(); }
    else if (act === 'tag') { state.tag = v; render(); }
    else if (act === 'impact') { state.impact = v; render(); }
    else if (act === 'prev') { const p = ds.filter(function (d) { return d < state.date; }).pop(); if (p) location.hash = '#/d/' + p; }
    else if (act === 'next') { const n = ds.find(function (d) { return d > state.date; }); if (n) location.hash = '#/d/' + n; }
    else if (act === 'latest') { location.hash = '#/d/' + ds[ds.length - 1]; }
    else if (act === 'refresh') { cacheDel('ed:' + state.date); cacheDel('dates'); state.datesReady = false; state.editionDate = null; route(); }
    else if (act === 'tab') { state.tab = v; setPref('tab', v); render(); }
    else if (act === 'chip') { t.classList.toggle('on'); t.setAttribute('aria-pressed', String(t.classList.contains('on'))); }
    else if (act === 'seg') { setSeg(t.dataset.seg, v); }
    else if (act === 'copy-prompt') { copyText(PROMPT).then(function (ok) { setMsg(ok ? 'ok' : 'err', ok ? '요청문을 복사했습니다. Claude 대화창에 붙여넣고, 맨 아래에 영어 원문을 넣어 보내세요.' : '복사하지 못했습니다. 브라우저 권한을 확인하세요.'); }); }
    else if (act === 'fill-paste') { fillFromPaste(); }
    else if (act === 'submit') { submitForm(false); }
    else if (act === 'force-submit') { submitForm(true); }
    else if (act === 'reset-form') { resetForm(false); }
    else if (act === 'unlock') { unlock(); }
    else if (act === 'logout') { clearKey(); render(); }
    else if (act === 'save-class') { saveClass(); }
  });
  // 날짜 선택칸
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'pickDate' && e.target.value) location.hash = '#/d/' + e.target.value;
  });
  // 검색칸: 입력이 멈추면 검색, 비우면 1면으로 복귀
  let searchTimer = null;
  $('#q').addEventListener('input', function (e) {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(function () {
      if (q.length >= 2) location.hash = '#/s/' + encodeURIComponent(q);
      else if (!q && state.view === 'search') location.hash = '#/d/' + (state.date || '');
    }, 400);
  });
  $('#q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(searchTimer); const q = e.target.value.trim(); if (q.length >= 2) location.hash = '#/s/' + encodeURIComponent(q); }
  });
  // 잠금 화면에서 엔터를 누르면 확인
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'lock-key') unlock();
  });
  // 번역 결과 칸에 붙여넣으면 바로 자동 인식
  document.addEventListener('paste', function (e) {
    if (e.target && e.target.id === 'f-paste') setTimeout(fillFromPaste, 60);
  });
  // 주소의 # 부분이 바뀌면 화면 이동
  window.addEventListener('hashchange', route);
  // 처음 열 때 한 번 실행
  route();
})();
</script>
